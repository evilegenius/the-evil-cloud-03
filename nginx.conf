# Répartiteur de chemins. Cloud Run n'expose que le port 8080 : c'est ici
# que chaque protocole / chaque nœud repart vers son propre Xray local.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;

    # Sert à vérifier que le conteneur vit, sans toucher aux tunnels.
    # `add_header Content-Type` ajoutait un SECOND en-tete Content-Type :
    # `default_type` est la bonne directive.
    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # Racine : un marqueur lisible, pas une page de bienvenue.
    #
    # Raison precise : Cloud Run garde l'ANCIENNE revision en vie quand la
    # nouvelle ne demarre pas. Le service repondait alors 200 avec une page
    # qui n'avait rien a voir, et rien ne disait quel conteneur tournait.
    # Ici la reponse dit elle-meme quel service et combien de noeuds.
    location = / {
      default_type text/plain;
      return 200 "dgm-cloud-run-stack | service=the-evil-cloud-03 | nodes=5 | protocols=VMess";
    }

    # La sonde : CE que ce conteneur sert, en JSON.
    #
    # Sans elle, un lien VMess ou Trojan qui refuse laisse deux causes
    # possibles et aucune facon de les distinguer : soit le fichier deploye
    # ne contient pas ce noeud, soit c'est le lien qui se trompe. Le panneau
    # lit cette liste et compare avec son propre parc.
    #
    # Aucune identite ici : ni UUID, ni mot de passe. Un service Cloud Run
    # est joignable par n'importe qui, donc ce fichier doit rester inoffensif.
    location = /stack.json {
      default_type application/json;
      add_header Access-Control-Allow-Origin "*";
      return 200 '{"stack":"dgm-cloud-run-stack","service":"the-evil-cloud-03","count":5,"protocols":["VMess"],"nodes":[{"name":"vmess-03-1","protocol":"VMess","path":"/🦋🐉","port":10001,"tag":"vmess-1"},{"name":"vmess-03-2","protocol":"VMess","path":"/🐺🦋🐉","port":10002,"tag":"vmess-2"},{"name":"vmess-03-3","protocol":"VMess","path":"/🦂🐺🦋🐉","port":10003,"tag":"vmess-3"},{"name":"vmess-03-4","protocol":"VMess","path":"/⚡🦂","port":10004,"tag":"vmess-4"},{"name":"vmess-03-5","protocol":"VMess","path":"/🐙⚡🦂","port":10005,"tag":"vmess-5"}]}';
    }

    # Les compteurs du serveur : gigas par client et adresses connectees.
    #
    # Ecrit par le gardien toutes les 20 s. Aucune identite dedans : juste des
    # volumes et des IP, pour que le panneau puisse afficher du reel au lieu
    # d'inventer des chiffres.
    location = /stats.json {
      default_type application/json;
      add_header Access-Control-Allow-Origin "*";
      root /tmp;
      try_files /stats.json =404;
    }

    # vmess-03-1 — VMess, chemin /🦋🐉
    location = "/🦋🐉" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-1 — meme nœud, sous-chemin
    location ^~ "/🦋🐉/" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-2 — VMess, chemin /🐺🦋🐉
    location = "/🐺🦋🐉" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-2 — meme nœud, sous-chemin
    location ^~ "/🐺🦋🐉/" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-3 — VMess, chemin /🦂🐺🦋🐉
    location = "/🦂🐺🦋🐉" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10003;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-3 — meme nœud, sous-chemin
    location ^~ "/🦂🐺🦋🐉/" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10003;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-4 — VMess, chemin /⚡🦂
    location = "/⚡🦂" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10004;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-4 — meme nœud, sous-chemin
    location ^~ "/⚡🦂/" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10004;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-5 — VMess, chemin /🐙⚡🦂
    location = "/🐙⚡🦂" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10005;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # vmess-03-5 — meme nœud, sous-chemin
    location ^~ "/🐙⚡🦂/" {
      if (-f /tmp/cut.flag) { return 503; }
      proxy_pass http://127.0.0.1:10005;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}

# Chemins servis par ce conteneur :
#   /🦋🐉 -> VMess (port local 10001)
#   /🐺🦋🐉 -> VMess (port local 10002)
#   /🦂🐺🦋🐉 -> VMess (port local 10003)
#   /⚡🦂 -> VMess (port local 10004)
#   /🐙⚡🦂 -> VMess (port local 10005)
# Sonde : GET /stack.json (aucune identite, juste les chemins)