name: deploy-cloud-run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE: the-evil-cloud-03
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La clé JSON du compte de service est stockée dans Settings → Secrets → Actions.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # --source . : Cloud Build construit l'image, aucun registre public à créer.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 3600 \
            --min-instances 0